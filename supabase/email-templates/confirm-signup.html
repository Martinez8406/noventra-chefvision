<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Potwierdź konto — ChefVision</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,0.08);">
          <tr>
            <td style="padding:36px 32px 20px;text-align:center;">
              <img
                src="https://app.chefvision.pl/Zrzut_ekranu_2026-05-02_115035-removebg-preview.png"
                alt="ChefVision"
                width="72"
                height="72"
                style="display:block;margin:0 auto 14px;border-radius:14px;"
              />
              <p style="margin:0;font-size:24px;font-weight:900;font-style:italic;letter-spacing:-0.03em;color:#0f172a;">
                ChefVision
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 36px;text-align:center;">
              <h1 style="margin:0 0 10px;font-size:20px;font-weight:800;color:#0f172a;">
                Potwierdź rejestrację
              </h1>
              <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:#64748b;">
                Kliknij przycisk, aby aktywować konto i rozpocząć korzystanie z ChefVision.
              </p>
              <a
                href="{{ .ConfirmationURL }}"
                style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 30px;border-radius:10px;"
              >
                Potwierdź adres e-mail
              </a>
              <p style="margin:26px 0 0;font-size:12px;line-height:1.6;color:#94a3b8;">
                Jeśli nie zakładałeś konta w ChefVision, zignoruj tę wiadomość.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:18px 0 0;font-size:12px;color:#94a3b8;">
          ChefVision · Profesjonalna wizualizacja dań
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
